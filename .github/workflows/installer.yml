name: インストーラーの検査

# インストーラーを作り、使い捨ての Windows で、入れて消すまでを画面なしで通す。
# インストーラーとそれが呼ぶ処理を変えた PR で動かす。ほかの PR で確かめたいときは、手で起動する
on:
  pull_request:
    paths:
      - .github/workflows/installer.yml
      - .github/scripts/installer-*.ps1
      - .github/actions/**
      - package.json
      - tools/dist/**
      - installer/**
      - internal/selfinstall/**
      - internal/cli/appuninstall.go
      - internal/cli/installerhooks.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: インストールとアンインストール
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: 0.0.0-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: vmeltype.exe を作る
        run: |
          pnpm dist -version $env:VERSION -goos windows -goarch amd64 -out "$env:RUNNER_TEMP\dist"
          if ($LASTEXITCODE -ne 0) { throw 'ビルドに失敗しました' }
      - name: インストーラーを作る
        run: |
          pnpm installer:build -Version $env:VERSION -SourceDir "$env:RUNNER_TEMP\dist\vMeltype-$env:VERSION-windows" -OutputDir "$env:RUNNER_TEMP\setup"
          if ($LASTEXITCODE -ne 0) { throw 'インストーラーを作れませんでした' }
          "SETUP=$env:RUNNER_TEMP\setup\vMeltype-$env:VERSION-setup.exe" >> $env:GITHUB_ENV
      - name: 通しで動かす
        run: |
          pnpm installer:smoke -Setup $env:SETUP -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw '通しの検査が失敗しました' }
      - name: インストーラーのログを残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}\vmeltype-setup.log
            ${{ runner.temp }}\Setup Log*.txt
          if-no-files-found: ignore
