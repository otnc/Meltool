name: インストーラーの検査

# インストーラーを作り、使い捨ての Windows で、入れて消すまでを画面なしで通す。
# インストーラーとそれが呼ぶ処理を変えた PR で動かす。ほかの PR で確かめたいときは、手で起動する
on:
  pull_request:
    paths:
      - .github/workflows/installer.yml
      - .github/scripts/installer-*.ps1
      - installer/**
      - internal/selfinstall/**
      - internal/cli/appuninstall.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: インストールとアンインストール
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: 0.0.0-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: vmeltype.exe を作る
        run: |
          $source = "$env:RUNNER_TEMP\source"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          go build -ldflags "-X main.version=$env:VERSION" -o "$source\vmeltype.exe" ./cmd/vmeltype
          if ($LASTEXITCODE -ne 0) { throw 'ビルドに失敗しました' }
          Copy-Item LICENSE "$source\LICENSE.txt"
      - name: インストーラーを作る
        run: |
          $setup = ./.github/scripts/installer-build.ps1 -Version $env:VERSION -SourceDir "$env:RUNNER_TEMP\source" -OutputDir "$env:RUNNER_TEMP\dist"
          "SETUP=$setup" >> $env:GITHUB_ENV
      - name: 通しで動かす
        run: ./.github/scripts/installer-smoke.ps1 -Setup $env:SETUP -Version $env:VERSION
      - name: インストーラーのログを残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}\vmeltype-setup.log
            ${{ runner.temp }}\Setup Log*.txt
          if-no-files-found: ignore
