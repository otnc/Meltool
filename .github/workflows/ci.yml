name: CI

# PR と main への push で動かす。文書だけの変更では Go の検査を飛ばす (changes ジョブが決める)。
# ブランチ保護の必須の検査には、最後の ci-ok だけを指定する。飛ばしたジョブがあっても、失敗がなければ通る
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 変更の判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # PR の変更したファイルを API で読むため
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 文書のほかに 1 つでも変更があれば code を true にする
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  go:
    name: Go の検査 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows が主な対象なので、PR でも省かない
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # コマンドは手元と同じく package.json の scripts を使う
      - name: 整形
        run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - if: runner.os != 'Linux'
        run: pnpm test
      # 競合の検査は cgo が要り遅いので、Linux だけで動かす
      - if: runner.os == 'Linux'
        run: pnpm run test:race

  commitlint:
    name: コミットメッセージの検査
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: "false"
      # PR に含まれるコミットは、そのまま main の履歴に残る
      - name: PR のコミット
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # merge commit のメッセージは PR のタイトルになるので、同じ決まりで検査する
      - name: PR のタイトル
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint --verbose

  secrets:
    name: 秘密情報の混入検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks の GitHub Action は組織のリポジトリではライセンスキーが要るので、CLI を直接動かす
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  ci-ok:
    name: CI の結果
    if: always()
    needs: [changes, go, commitlint, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失敗か中止のジョブがないかを確かめる
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
